<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NevaWebDesign | Yönetim Paneli</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#261b37;background:#f7f5fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.hidden{display:none!important}.shell{max-width:1240px;margin:auto;padding:25px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}.brand{font-size:23px;font-weight:850;letter-spacing:-.9px}.brand span{color:#8146e0}.muted{color:#7a7289}.card{background:#fff;border:1px solid #eae5f1;border-radius:19px;padding:23px;box-shadow:0 8px 35px #30204608}.login{max-width:450px;margin:11vh auto}.login h1{font-size:27px;margin:22px 0 8px}label{display:block;font-weight:650;font-size:13px;margin:13px 0 6px}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #ded8e9;border-radius:11px;background:white;color:#261b37}textarea{min-height:80px;resize:vertical}.btn{background:#7540d4;color:#fff;border:0;border-radius:11px;padding:12px 17px;font-weight:750}.btn.secondary{background:#eee8f8;color:#6135a6}.btn.ghost{background:white;border:1px solid #e1d9ef;color:#49365f}.btn.danger{background:#fff1f1;color:#a33}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat small{color:#766e83}.stat strong{display:block;font-size:26px;margin-top:10px}.tabs{display:flex;gap:8px;overflow-x:auto;margin:20px 0}.tabs button{border:1px solid #e4dded;background:white;padding:12px 17px;border-radius:10px;white-space:nowrap}.tabs button.active{background:#7540d4;color:white;border-color:#7540d4}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:14px 11px;border-bottom:1px solid #f0ecf5;font-size:13px;vertical-align:top}th{color:#756a83;font-size:12px}td button{font-size:12px;padding:7px 10px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}.wide{grid-column:1/-1}dialog{border:0;border-radius:19px;padding:0;width:min(650px,94vw);max-height:90vh;box-shadow:0 25px 90px #20133355}dialog::backdrop{background:#1e102a99}.dialog-body{padding:25px;overflow:auto;max-height:88vh}#message{margin:10px 0;color:#7b3ac9;min-height:20px;font-size:14px}.tag{display:inline-block;background:#f2ecfa;color:#7540d4;border-radius:30px;padding:5px 9px;font-size:11px}.empty{padding:30px;text-align:center;color:#7b7386}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.shell{padding:14px}.form-grid{grid-template-columns:1fr}.card{padding:16px}.top{align-items:flex-start}.brand{font-size:20px}}
</style></head><body><div class="shell">
<header class="top"><div><div class="brand">NEVA<span>WEBDESIGN</span></div><div class="muted" style="font-size:12px">İşletme Yönetim Merkezi</div></div><div class="row"><a href="/" class="muted" style="font-size:13px">← Siteye dön</a><button id="logout" class="btn ghost hidden">Çıkış yap</button></div></header>
<section id="login" class="card login"><div class="tag">Güvenli yönetici girişi</div><h1>Tekrar hoş geldin.</h1><p class="muted">Müşterilerini, tekliflerini ve projelerini tek yerden yönet.</p><form id="loginForm"><label for="email">E-posta</label><input id="email" type="email" autocomplete="username" required><label for="password">Şifre</label><input id="password" type="password" autocomplete="current-password" required><button class="btn" style="width:100%;margin-top:20px">Giriş Yap</button></form><p id="loginError" role="alert" style="color:#b43b48"></p></section>
<section id="app" class="hidden"><div class="row between"><div><h1 style="margin-bottom:5px">Genel Bakış</h1><p class="muted">NevaWebDesign iş takibi</p></div><button class="btn" id="addBtn">+ Yeni müşteri</button></div><div class="stats"><div class="card stat"><small>Müşteriler</small><strong id="clientCount">0</strong></div><div class="card stat"><small>Aktif projeler</small><strong id="projectCount">0</strong></div><div class="card stat"><small>Toplam tahsilat</small><strong id="paidSum">0 TL</strong></div><div class="card stat"><small>Giderler</small><strong id="expenseSum">0 TL</strong></div></div><nav class="tabs" id="tabs"><button class="active" data-tab="clients">Müşteriler</button><button data-tab="quotes">Teklifler</button><button data-tab="projects">Projeler</button><button data-tab="transactions">Ödemeler & Giderler</button></nav><div class="card"><div class="row between"><h2 id="sectionTitle">Müşteriler</h2><div class="row"><button id="exportRecords" class="btn ghost">CSV dışa aktar</button><button id="newRecord" class="btn secondary">+ Yeni kayıt</button></div></div><div class="table-wrap" id="records"></div></div></section><div id="message" role="status"></div>
</div><dialog id="editor"><div class="dialog-body"><div class="row between"><h2 id="dialogTitle">Yeni kayıt</h2><button id="closeDialog" class="btn ghost" type="button">Kapat</button></div><form id="recordForm"><div id="fields" class="form-grid"></div><div class="row" style="margin-top:20px"><button class="btn" type="submit">Kaydet</button><button type="button" id="cancelDialog" class="btn ghost">Vazgeç</button></div></form></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./config.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),cfg=window.NEVA_CRM_CONFIG||{};
let db=null,tab='clients',data={clients:[],quotes:[],projects:[],transactions:[]},editing=null;
const currency=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(n)||0);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defs={
clients:{table:'nwd_clients',title:'Müşteriler',fields:[['name','Müşteri adı','text',true],['business_name','İşletme','text'],['phone','Telefon','tel'],['email','E-posta','email'],['notes','Notlar','textarea']]},
quotes:{table:'nwd_quotes',title:'Teklifler',fields:[['client_id','Müşteri','client',true],['quote_number','Teklif numarası','text',true],['service','Hizmet','text',true],['description','Açıklama','textarea'],['amount','Tutar (TL)','number',true],['tax_amount','Vergi (TL)','number'],['status','Durum','quoteStatus'],['valid_until','Geçerlilik tarihi','date']]},
projects:{table:'nwd_projects',title:'Projeler',fields:[['client_id','Müşteri','client',true],['title','Proje adı','text',true],['status','Aşama','projectStatus'],['agreed_amount','Anlaşma tutarı (TL)','number'],['estimated_hours','Tahmini saat','number'],['actual_hours','Gerçekleşen saat','number'],['start_date','Başlangıç','date'],['due_date','Teslim','date'],['notes','Notlar','textarea']]},
transactions:{table:'nwd_transactions',title:'Ödemeler & Giderler',fields:[['project_id','Proje','project',true],['type','İşlem türü','transactionType',true],['category','Kategori','text'],['amount','Tutar (TL)','number',true],['occurred_on','Tarih','date'],['notes','Notlar','textarea']]}
};
const opts={quoteStatus:[['draft','Taslak'],['sent','Gönderildi'],['accepted','Onaylandı'],['rejected','Reddedildi'],['expired','Süresi doldu']],projectStatus:[['planning','Planlama'],['design','Tasarım'],['development','Geliştirme'],['review','Kontrol'],['completed','Tamamlandı'],['cancelled','İptal']],transactionType:[['payment','Tahsilat'],['expense','Gider']]};
function notify(m){$('message').textContent=m;}
function names(id,list){return data[list].find(x=>x.id===id)?.[list==='clients'?'business_name':'title']||data[list].find(x=>x.id===id)?.name||'—';}
function fieldHtml([key,label,type,required],value){const v=value??'',req=required?'required':'',name='name="'+safe(key)+'"';
if(type==='textarea')return '<div class="wide"><label>'+safe(label)+'</label><textarea '+name+'>'+safe(v)+'</textarea></div>';
if(type==='client'||type==='project'||opts[type]){const options=type==='client'?data.clients.map(x=>[x.id,x.business_name||x.name]):type==='project'?data.projects.map(x=>[x.id,x.title]):opts[type];return '<div><label>'+safe(label)+'</label><select '+name+' '+req+'><option value="">Seçiniz</option>'+options.map(([id,txt])=>'<option value="'+safe(id)+'" '+(String(v)===String(id)?'selected':'')+'>'+safe(txt)+'</option>').join('')+'</select></div>';}
return '<div><label>'+safe(label)+'</label><input '+name+' type="'+type+'" '+req+' '+(type==='number'?'min="0" step="0.01"':'')+' value="'+safe(v)+'"></div>';}
function openEditor(id=null){editing=id;const record=data[tab].find(x=>x.id===id)||{};$('dialogTitle').textContent=(id?'Düzenle: ':'Yeni ')+defs[tab].title;$('fields').innerHTML=defs[tab].fields.map(f=>fieldHtml(f,record[f[0]])).join('');$('editor').showModal();}
function render(){const c=data.clients,p=data.projects,t=data.transactions;$('clientCount').textContent=c.length;$('projectCount').textContent=p.filter(x=>!['completed','cancelled'].includes(x.status)).length;$('paidSum').textContent=currency(t.filter(x=>x.type==='payment').reduce((a,x)=>a+Number(x.amount),0));$('expenseSum').textContent=currency(t.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount),0));$('sectionTitle').textContent=defs[tab].title;
const headers={clients:['Müşteri','İşletme','Telefon','E-posta'],quotes:['Teklif','Müşteri','Hizmet','Tutar','Durum'],projects:['Proje','Müşteri','Aşama','Anlaşma'],transactions:['Proje','Tür','Tutar','Tarih']};
const cells={clients:x=>[x.name,x.business_name,x.phone,x.email],quotes:x=>[x.quote_number,names(x.client_id,'clients'),x.service,currency(Number(x.amount)+Number(x.tax_amount)),x.status],projects:x=>[x.title,names(x.client_id,'clients'),x.status,currency(x.agreed_amount)],transactions:x=>[names(x.project_id,'projects'),x.type==='payment'?'Tahsilat':'Gider',currency(x.amount),x.occurred_on]};
$('records').innerHTML=data[tab].length?'<table><thead><tr>'+headers[tab].map(h=>'<th>'+safe(h)+'</th>').join('')+'<th>İşlem</th></tr></thead><tbody>'+data[tab].map(x=>'<tr>'+cells[tab](x).map(v=>'<td>'+safe(v||'—')+'</td>').join('')+'<td><div class="row"><button class="btn ghost" data-edit="'+safe(x.id)+'">Düzenle</button><button class="btn danger" data-delete="'+safe(x.id)+'">Sil</button></div></td></tr>').join('')+'</tbody></table>':'<div class="empty">Henüz kayıt yok. Yeni kayıt ekleyerek başlayabilirsin.</div>';}
async function load(){for(const k of Object.keys(defs)){const {data:rows,error}=await db.from(defs[k].table).select('*').order('created_at',{ascending:false}).limit(500);if(error)throw error;data[k]=rows||[];}render();}
async function authenticate(){const {data:{user},error}=await db.auth.getUser();if(error||!user){$('login').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden');return;}const {data:admin,error:adminError}=await db.from('nwd_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(adminError||!admin){await db.auth.signOut();$('loginError').textContent='Bu hesabın yönetici yetkisi bulunmuyor.';return;}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');await load();}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';const btn=e.target.querySelector('button');btn.disabled=true;try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await authenticate();}catch(err){$('loginError').textContent=err.message||'Giriş başarısız.';}finally{btn.disabled=false;}};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload();};
$('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render();};
$('addBtn').onclick=()=>{tab='clients';document.querySelector('[data-tab="clients"]').click();openEditor();};
$('newRecord').onclick=()=>openEditor();$('records').onclick=async e=>{
const edit=e.target.closest('[data-edit]');if(edit){openEditor(edit.dataset.edit);return;}
const del=e.target.closest('[data-delete]');if(!del)return;
const item=data[tab].find(x=>x.id===del.dataset.delete);if(!item)return;
const related=tab==='clients'?(data.quotes.filter(x=>x.client_id===item.id).length+data.projects.filter(x=>x.client_id===item.id).length):tab==='projects'?data.transactions.filter(x=>x.project_id===item.id).length:0;
const label=tab==='clients'?(item.business_name||item.name):tab==='quotes'?item.quote_number:tab==='projects'?item.title:item.category||item.type;
const warning=related?'\\n\\nDİKKAT: Bu kayda bağlı '+related+' teklif/proje/işlem kaydı da silinebilir. Önce bu kayıtları kontrol et.':'';
if(!confirm('Bu kaydı kalıcı olarak silmek istiyor musun?\\n'+label+warning))return;
if(related){notify('Bağlı kayıtlar bulundu. Güvenlik için önce ilgili teklif, proje ve işlemleri silmelisin.');return;}
del.disabled=true;
try{const {error}=await db.from(defs[tab].table).delete().eq('id',item.id);if(error)throw error;await load();notify('Kayıt silindi.');}catch(err){notify('Silme başarısız: '+err.message);}finally{del.disabled=false;}
};
$('exportRecords').onclick=()=>{
const records=data[tab];if(!records.length){notify('Dışa aktarılacak kayıt yok.');return;}
const columns=Object.keys(records[0]).filter(k=>k!=='id'&&k!=='created_at');
const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
const csv='\\uFEFF'+[columns.map(quote).join(';'),...records.map(x=>columns.map(k=>quote(x[k])).join(';'))].join('\\r\\n');
const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
a.href=url;a.download='nevawebdesign-'+tab+'-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
notify('CSV dosyası hazırlandı. Kişisel veriler içerdiğinden güvenli sakla.');
};
$('closeDialog').onclick=$('cancelDialog').onclick=()=>$('editor').close();
$('recordForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),row={};for(const [key,label,type] of defs[tab].fields){const v=String(f.get(key)||'').trim();row[key]=v===''?null:type==='number'?Number(v):v;}if(tab==='quotes'&&!row.tax_amount)row.tax_amount=0;if(tab==='transactions'&&!row.occurred_on)row.occurred_on=new Date().toISOString().slice(0,10);const btn=e.target.querySelector('[type=submit]');btn.disabled=true;try{const q=editing?db.from(defs[tab].table).update(row).eq('id',editing):db.from(defs[tab].table).insert(row);const {error}=await q;if(error)throw error;$('editor').close();await load();notify('Kayıt başarıyla kaydedildi.');}catch(err){notify('Kaydedilemedi: '+err.message);}finally{btn.disabled=false;}};
if(!cfg.url||!cfg.anonKey||cfg.url.includes('BURAYA')||cfg.anonKey.includes('BURAYA')){$('loginError').textContent='Supabase bağlantısı henüz yapılandırılmadı. admin/config.js dosyasını düzenleyin.';$('loginForm').querySelector('button').disabled=true;}else if(!window.supabase){$('loginError').textContent='Supabase kütüphanesi yüklenemedi. İnternet bağlantını kontrol et.';}else{db=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});authenticate().catch(e=>notify('Bağlantı hatası: '+e.message));}
</script></body></html>
